server:
  port: 8700
  forward-headers-strategy: none
app:
  identity:
    url: ${IDENTITY_SERVICE_URL:http://127.0.0.1:8701}
    api-key: ${IDENTITY_SERVICE_KEY:}
  auth-proxy-key: ${AUTH_PROXY_KEY:}
  gateway:
    trusted-proxies: ${GATEWAY_TRUSTED_PROXIES:}
    allowed-hosts: ${GATEWAY_ALLOWED_HOSTS:localhost,127.0.0.1,[::1]}
    allowed-origins: ${ACCOUNT_PUBLIC_BASE_URL:http://localhost:8700},${GATEWAY_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
    require-origin: ${GATEWAY_REQUIRE_ORIGIN:false}
  issuer: ${JWT_ISSUER:http://localhost:8701}
  jwks-uri: ${JWKS_URI:http://localhost:8701/.well-known/jwks.json}
spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service-v1
              uri: ${AUTH_URL:http://localhost:8701}
              predicates:
                - Path=/api/v1/auth/**
            - id: user-service-v1
              uri: ${USER_URL:http://localhost:8702}
              predicates:
                - Path=/api/v1/users/**
management:
  endpoints:
    web:
      exposure:
        include: health,info
