# Optional local P5 stack. Run independently of the PostgreSQL/Redis Compose project.
name: hybrid-observability
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.164.0
    user: '0:0'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: ['--config=/etc/otelcol/config.yml']
    ports:
      - '127.0.0.1:${OTEL_HTTP_PORT:-4318}:4318'
      - '127.0.0.1:${OTEL_HEALTH_PORT:-13133}:13133'
    volumes:
      - ./infra/observability/collector.yml:/etc/otelcol/config.yml:ro
      - ./logs/telemetry:/var/log/hybrid:ro
      - collector-data:/var/lib/otelcol
    depends_on: [tempo, loki]
    networks: [observability]
    mem_limit: 512m
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.15.1
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.retention.time=7d', '--storage.tsdb.path=/prometheus']
    ports: ['127.0.0.1:${PROMETHEUS_PORT:-9090}:9090']
    volumes:
      - ./infra/observability/prometheus-p5.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/alerts-p5.yml:/etc/prometheus/alerts-p5.yml:ro
      - prometheus-data:/prometheus
    networks: [observability]
    mem_limit: 512m
    restart: unless-stopped
  loki:
    image: grafana/loki:3.7.9
    command: ['-config.file=/etc/loki/config.yml']
    ports: ['127.0.0.1:${LOKI_PORT:-3100}:3100']
    volumes:
      - ./infra/observability/loki.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    networks: [observability]
    mem_limit: 512m
    restart: unless-stopped
  tempo:
    image: grafana/tempo:3.1.1
    command: ['-config.file=/etc/tempo/config.yml']
    ports: ['127.0.0.1:${TEMPO_PORT:-3200}:3200']
    volumes:
      - ./infra/observability/tempo.yml:/etc/tempo/config.yml:ro
      - tempo-data:/var/tempo
    networks: [observability]
    mem_limit: 512m
    restart: unless-stopped
  alertmanager:
    image: prom/alertmanager:v0.34.2
    command: ['--config.file=/etc/alertmanager/config.yml','--storage.path=/alertmanager']
    ports: ['127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093']
    volumes:
      - ./infra/observability/alertmanager.yml:/etc/alertmanager/config.yml:ro
      - alertmanager-data:/alertmanager
    networks: [observability]
    mem_limit: 128m
    restart: unless-stopped
  grafana:
    image: grafana/grafana:13.3.0
    ports: ['127.0.0.1:${GRAFANA_PORT:-3001}:3000']
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD before starting the P5 stack}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus,loki,tempo,alertmanager]
    networks: [observability]
    mem_limit: 512m
    restart: unless-stopped
networks:
  observability:
    driver: bridge
volumes:
  collector-data:
  prometheus-data:
  loki-data:
  tempo-data:
  alertmanager-data:
  grafana-data:
