<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Account security</title>
  <script src="/api/v1/auth/account-actions.js" defer></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f3f4f6; color: #1f2937; font: 16px/1.6 system-ui, sans-serif; }
    main { width: 100%; max-width: 460px; padding: 36px; border-radius: 16px; background: white; box-shadow: 0 8px 32px #1f29370a; }
    .brand { font-size: 13px; font-weight: 700; color: #4f46e5; letter-spacing: .08em; text-transform: uppercase; }
    h1 { font-size: 28px; line-height: 1.2; margin: 16px 0; }
    p { color: #6b7280; }
    label { display: block; font-weight: 600; margin-top: 20px; }
    input { width: 100%; padding: 12px; border: 1px solid #9ca3af; border-radius: 8px; font: inherit; margin-top: 6px; }
    button { width: 100%; border: 0; border-radius: 8px; padding: 14px; margin-top: 24px; background: #4f46e5; color: white; font: inherit; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    :focus-visible { outline: 3px solid #818cf8; outline-offset: 3px; }
    #message { white-space: pre-line; }
    #message[data-error="true"] { color: #b91c1c; }
    a { color: #4338ca; }
    small { display: block; color: #6b7280; margin-top: 8px; }
    [hidden] { display: none !important; }
    @media (max-width: 480px) { main { padding: 24px; } }
  </style>
</head>
<body>
<main>
  <span class="brand">Account security</span>
  <h1 id="title">Secure your account</h1>
  <p id="description">Loading…</p>
  <p id="message" role="status" aria-live="polite" tabindex="-1"></p>
  <form id="action-form" hidden>
    <div id="email-fields" hidden>
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="email" maxlength="254">
    </div>
    <div id="password-fields" hidden>
      <label for="password">New password</label>
      <input id="password" name="newPassword" type="password" autocomplete="new-password" aria-describedby="password-help">
      <small id="password-help">Use at least 12 characters.</small>
      <label for="confirm-password">Confirm new password</label>
      <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password">
    </div>
    <button id="submit" type="submit">Continue</button>
  </form>
  <p id="recovery" hidden><a href="/api/v1/auth/forgot-password">Request a new reset link</a></p>
  <noscript><p>Please enable JavaScript to continue securely.</p></noscript>
</main>
</body>
</html>
