server:
  port: 8701
spring:
  application:
    name: auth-service
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASS:}
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.ssl.enable]": ${SMTP_SECURE:false}
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.starttls.required]": true
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/authdb}
    username: ${DB_USERNAME:auth}
    password: ${DB_PASSWORD:authdev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER:http://localhost:8701}
app:
  email-from: ${EMAIL_FROM:}
  issuer: ${JWT_ISSUER:http://localhost:8701}
  private-key: ${JWT_PRIVATE_KEY:./keys/private.pem}
  public-key: ${JWT_PUBLIC_KEY:./keys/public.pem}
management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
