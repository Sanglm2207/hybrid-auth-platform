server:
  address: ${SERVICE_BIND_ADDRESS:127.0.0.1}
  port: 8701
spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/authdb}
    username: ${DB_USERNAME:auth}
    password: ${DB_PASSWORD:authdev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER:http://localhost:8701}
app:
  mail-service:
    url: ${MAIL_SERVICE_URL:http://127.0.0.1:8703}
    api-key: ${MAIL_SERVICE_API_KEY:}
  issuer: ${JWT_ISSUER:http://localhost:8701}
  private-key: ${JWT_PRIVATE_KEY:./keys/private.pem}
  public-key: ${JWT_PUBLIC_KEY:./keys/public.pem}
management:
  endpoints:
    web:
      exposure:
        include: health,info
