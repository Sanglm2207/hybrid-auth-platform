<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Verify your email</title></head>
<body style="margin:0;background:#f3f4f6;font-family:Arial,sans-serif;color:#1f2937;">
  <table role="presentation" style="width:100%;border-collapse:collapse;"><tr><td style="padding:32px 16px;">
    <table role="presentation" style="width:100%;max-width:560px;margin:auto;background:#ffffff;border-radius:12px;"><tr><td style="padding:32px;">
      <h1 style="margin:0 0 20px;font-size:24px;">Verify your email</h1>
      <p>Use the code below to complete your registration:</p>
      <p style="padding:20px;background:#eef2ff;border-radius:8px;text-align:center;font-size:32px;font-weight:bold;letter-spacing:8px;">{{otp}}</p>
      <p>This code expires in {{expiresInMinutes}} minutes. Do not share it with anyone.</p>
      <p style="font-size:13px;color:#6b7280;">If you did not request this email, you can ignore it.</p>
      <hr style="border:0;border-top:1px solid #e5e7eb;margin:28px 0 18px;">
      <p style="font-size:13px;line-height:1.7;color:#6b7280;">Best regards,<br><strong style="color:#374151;">{{signature}}</strong><br>Automated account security notification</p>
    </td></tr></table>
  </td></tr></table>
</body>
</html>
