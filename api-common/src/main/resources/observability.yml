spring:
  reactor:
    context-propagation: auto
management:
  tracing:
    enabled: true
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY:1.0}
    propagation:
      type: w3c
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://127.0.0.1:4318/v1/traces}
      export:
        enabled: ${OBSERVABILITY_ENABLED:false}
      connect-timeout: 1s
      timeout: 2s
    metrics:
      export:
        enabled: ${OBSERVABILITY_ENABLED:false}
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://127.0.0.1:4318/v1/metrics}
        step: ${METRICS_EXPORT_STEP:15s}
        base-time-unit: seconds
        aggregation-temporality: cumulative
        connect-timeout: 1s
        read-timeout: 2s
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
      service.instance.id: ${SERVICE_INSTANCE_ID:${spring.application.name}-${server.port}}
      deployment.environment: ${DEPLOYMENT_ENVIRONMENT:local}
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      minimum-expected-value:
        http.server.requests: 1ms
      maximum-expected-value:
        http.server.requests: 30s
      slo:
        http.server.requests: 50ms,100ms,250ms,500ms,1s,2s,5s
