global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts-p5.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
scrape_configs:
  - job_name: hybrid-otel
    honor_labels: true
    static_configs:
      - targets: ['otel-collector:8889']
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
